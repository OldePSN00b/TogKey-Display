name: Tests

on:
  push:
    branches: [main]
  # Every pull request, including ones stacked on other feature branches.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pester and UI smoke test
    # The display uses WPF and Windows HID APIs, so tests run on Windows.
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Show versions
        run: |
          $PSVersionTable | Format-Table -AutoSize | Out-String
          "Runtime: $([Environment]::Version)"

      - name: Check PowerShell syntax
        # Catches parse errors in the WPF script, which the unit tests do not load.
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem -Recurse -Include *.ps1, *.psm1) {
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors)
            foreach ($e in $errors) {
              $failed = $true
              "::error file=$($file.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
            }
          }
          if ($failed) { exit 1 }
          'All scripts parse.'

      - name: Install Pester 5
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -ge '5.0')) {
            Install-PSResource -Name Pester -Version '[5.5.0,6.0.0)' -Scope CurrentUser -TrustRepository -Quiet
          }
          Get-Module -ListAvailable Pester | Select-Object Name, Version | Format-Table | Out-String

      - name: Run Pester tests
        run: |
          Import-Module Pester -MinimumVersion 5.0
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.Output.CIFormat = 'GithubActions'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.TestResult.OutputPath = 'test-results.xml'
          Invoke-Pester -Configuration $config

      - name: Render display views
        # Builds the real window off-screen (-PreviewPath) in each view and saves a PNG.
        if: success() || failure()
        run: |
          $out = (New-Item -ItemType Directory -Force 'previews').FullName
          foreach ($view in 'Full', 'Compact', 'Strip') {
            $png = Join-Path $out "$($view.ToLower()).png"
            $arguments = [Collections.Generic.List[string]]@('-NoProfile', '-STA', '-File', './TogKey Display.ps1',
              '-VialPath', './tests/fixtures/sample-layout.json',
              '-LabelsPath', (Join-Path $env:RUNNER_TEMP 'labels.json'),
              '-SettingsPath', (Join-Path $env:RUNNER_TEMP 'preferences.json'),
              '-PreviewPath', $png)
            if ($view -ne 'Full') { $arguments.Add('-' + $view) }
            & pwsh $arguments
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $png)) { throw "$view view failed to render." }
            "$view view rendered: $((Get-Item $png).Length) bytes"
          }

      - name: Validate sample export
        run: pwsh -NoProfile -File './TogKey Display.ps1' -ValidateOnly -VialPath './tests/fixtures/sample-layout.json'

      - name: Upload test results and previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.xml
            previews/
          if-no-files-found: ignore

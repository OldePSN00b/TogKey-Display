name: Release

# Push a tag that matches the version in TogKey Core.psm1, e.g.:  git tag v1.0.0; git push origin v1.0.0
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    name: Tests
    uses: ./.github/workflows/tests.yml

  release:
    name: Draft GitHub release
    needs: test
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Build package
        id: package
        # Fails if the tag does not match the version in TogKey Core.psm1.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $result = ./build/New-ReleasePackage.ps1 -OutputDirectory dist -ExpectedVersion $env:TAG
          $result | Format-List | Out-String
          "zip=$($result.Package)" >> $env:GITHUB_OUTPUT
          "sha=$($result.HashFile)" >> $env:GITHUB_OUTPUT

      - name: Create draft release
        # A draft is visible only to maintainers until it is reviewed and published on GitHub.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ZIP: ${{ steps.package.outputs.zip }}
          SHA: ${{ steps.package.outputs.sha }}
        run: |
          $arguments = @('release', 'create', $env:TAG, $env:ZIP, $env:SHA,
            '--draft', '--verify-tag', '--generate-notes', '--title', "TogKey Display $env:TAG")
          if ($env:TAG -match '-') { $arguments += '--prerelease' }
          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the release.' }
